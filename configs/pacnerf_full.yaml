# PAC-NeRF single frame, whole scene (object + table + room); object masks in masks/ for selection.
# Experiment parameters
iterations: 15_000
densify_from: 500
densify_until: 12_000
normal_weight: 0.1
contribution_weight: 0.1
interpenetration_weight: 1e-4

# Dataset parameters
dataset: "blender"
data_path: "data/pacnerf_powerfoam"
scene: "elastic_0_f0_full"
alpha_format_on_disk: "straight"
downsample: [1]
downsample_iterations: [0]
is_pinhole: true
eval: false

# Model parameters
init_type: "random_unbounded"
init_points: 30_000
final_points: 60_000
bkgd_color: [0.0, 0.0, 0.0]
render_objective: "volume"
sv_dof: 8
num_texel_sites: 8

# Optimization parameters
points_lr_init: 1e-3
points_lr_final: 5e-5
density_lr_init: 1e0
density_lr_final: 1e0
radii_lr_init: 5e-5
radii_lr_final: 5e-6
quaternions_lr_init: 1e-1
quaternions_lr_final: 1e-2
texel_sites_lr_init: 1e-2
texel_sites_lr_final: 1e-3
texel_sv_axis_lr_init: 5e-2
texel_sv_axis_lr_final: 5e-3
texel_sv_rgb_lr_init: 5e-3
texel_sv_rgb_lr_final: 5e-4
texel_height_lr_init: 5e-3
texel_height_lr_final: 5e-4